name: backup_live

on:
  schedule:
    - cron: '0 */5 * * *'
  workflow_dispatch:

jobs:
  stream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Install FFmpeg, Audio and Python Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg pulseaudio xvfb
          pip install moviepy==1.0.3 pillow

      - name: Start Virtual Audio and VDO.Ninja Voice Room
        run: |
          pulseaudio -D --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=VirtualSpeaker sink_properties=device.description=VirtualSpeaker
          pactl set-default-sink VirtualSpeaker
          xvfb-run --auto-servernum google-chrome --no-sandbox --disable-gpu --autoplay-policy=no-user-gesture-required "https://vdo.ninja" &
          sleep 10

      - name: Start Python Live Stream Loop
        env:
          YOUTUBE_KEY: ${{ secrets.YOUTUBE_KEY }}
        run: python stream.py
