name: backup_live

on:
  schedule:
    - cron: '0 */5 * * *'
  workflow_dispatch:

jobs:
  stream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg pulseaudio openssh-client
          pip install flask flask-socketio simple-websocket

      - name: Start Live Stream with Direct Web Voice
        run: python3 stream.py
