name: backup_live

on:
  schedule:
    - cron: '0 */5 * * *'
  workflow_dispatch:

jobs:
  stream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg pulseaudio curl
          pip install flask flask-socketio simple-websocket
          ARCH=$(dpkg --print-architecture)
          curl -fsSL "https://github.com{ARCH}" -o cloudflared
          chmod +x cloudflared
          sudo mv cloudflared /usr/local/bin/

      - name: Start Live Stream with Direct Web Voice
        env:
          YOUTUBE_KEY: ${{ secrets.YOUTUBE_KEY }}
        run: python3 stream.py
